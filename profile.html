<!-- profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - College Management System</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Your Profile</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="login.html">Logout</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Personal Information</h2>
            <table>
                <tr>
                    <th>Student ID</th>
                    <td>12345</td>
                </tr>
                <tr>
                    <th>Name</th>
                    <td>John Doe</td>
                </tr>
                <tr>
                    <th>Email</th>
                    <td>johndoe@email.com</td>
                </tr>
                <tr>
                    <th>Course</th>
                    <td>Computer Science</td>
                </tr>
            </table>
        </section>

        <section>
            <h2>Update Profile</h2>
            <form action="profile-update.html" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" value="John Doe" required><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" value="johndoe@email.com" required><br>

                <label for="course">Course:</label>
                <input type="text" id="course" name="course" value="Computer Science" required><br>

                <button type="submit">Update Profile</button>
            </form>
        </section>

        <section>
            <h2>Change Password</h2>
            <form action="change-password.html" method="post">
                <label for="old-password">Old Password:</label>
                <input type="password" id="old-password" name="old-password" required><br>

                <label for="new-password">New Password:</label>
                <input type="password" id="new-password" name="new-password" required><br>

                <button type="submit">Change Password</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 XYZ College. All rights reserved.</p>
    </footer>
</body>
</html>
